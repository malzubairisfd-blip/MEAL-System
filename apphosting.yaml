# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

kind: "AppStack"
apiVersion: "v1"

runConfig:
  # CRITICAL: Even with the right packages, Chromium will crash if memory is < 1GB.
  # 2Gi is the "sweet spot" for Puppeteer on Cloud Run/App Hosting.
  memory: 2Gi
  cpu: 1
  timeoutSeconds: 60
  maxInstances: 1
  
  # These environment variables help Puppeteer find the right paths in Linux
  env:
    - variable: GOLDEN_IMAGES_PATH
      value: "/tmp"
    - variable: XDG_CONFIG_HOME
      value: "/tmp"

# The 'packages' section tells the builder to install these via 'apt-get' 
# during the container image construction.
buildConfig:
  packages:
    - gconf-service
    - libasound2
    - libatk1.0-0
    - libatk-bridge2.0-0
    - libc6
    - libcairo2
    - libcups2
    - libdbus-1-3
    - libdrm2
    - libexpat1
    - libfontconfig1
    - libgcc1
    - libgconf-2-4
    - libgdk-pixbuf2.0-0
    - libglib2.0-0
    - libgbm1
    - libgtk-3-0
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libpangocairo-1.0-0
    - libstdc++6
    - libx11-6
    - libx11-xcb1
    - libxcb1
    - libxcomposite1
    - libxcursor1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxi6
    - libxkbcommon0
    - libxrandr2
    - libxrender1
    - libxss1
    - libxtst6
    - ca-certificates
    - fonts-liberation
    - lsb-release
    - xdg-utils
    - wget